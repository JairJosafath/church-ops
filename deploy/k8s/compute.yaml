# Compute "small": resources for the container `app`. A strategic-merge patch,
# applied through `patches` in kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations-worker
spec:
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
