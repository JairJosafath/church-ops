# Kubernetes manifests for integrations-worker; render them with `kubectl kustomize deploy/k8s`.
# theos ships them through an `argoCD` DeployTarget: Argo CD syncs this
# folder at each release's tag with the release's image. To ship them yourself,
# point the image at what you build from the Dockerfile, for example:
#   cd deploy/k8s && kustomize edit set image integrations-worker=registry.example.com/integrations-worker:1.0.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
patches:
  # Resources from the Compute layer, on the Deployment or the Job.
  - path: compute.yaml
