apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations-worker
  labels:
    app.kubernetes.io/name: integrations-worker
    app.kubernetes.io/part-of: church-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: integrations-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integrations-worker
        app.kubernetes.io/part-of: church-ops
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Built from the Dockerfile; override it in kustomization.yaml.
          image: integrations-worker:dev
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
