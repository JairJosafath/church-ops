apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: church-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: church-ops
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Built from the Dockerfile; override it in kustomization.yaml.
          image: api:dev
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            # The token issuer and audience the app verifies against.
            - configMapRef:
                name: api-auth
            # Connection settings, one ConfigMap per Connector.
            - configMapRef:
                name: api-postgres
          env:
            # The database password, from the Secret the postgres Connector reads.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-postgres
                  key: password
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
