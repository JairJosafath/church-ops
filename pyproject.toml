[project]
name = "api"
version = "0.1.0"
description = "API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "pyjwt[crypto]>=2.15",
    "uvicorn[standard]>=0.50",
    "psycopg[binary,pool]>=3.3",
]

[dependency-groups]
# The tools a Standard checks with are pinned exactly; uv.lock pins the rest.
dev = [
    "httpx2>=2.13",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
