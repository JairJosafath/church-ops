[project]
name = "integrations-worker"
version = "0.1.0"
description = "Integrations worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=17.4",
]

[project.scripts]
integrations-worker = "app.worker:main"

[dependency-groups]
# The tools a Standard checks with are pinned exactly; uv.lock pins the rest.
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
