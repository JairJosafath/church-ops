# church-ops as a Brief: the same product as model/, in a church's own words,
# so the planner Agent can be shown producing the model. Apply it alone,
# after model/project.yaml and model/domain.yaml, so the planner plans from
# the idea and the catalog, and names the church-ops Domain on the system it
# makes. If its round fails, model/ is the fallback (CLAUDE.md). Applied after
# model/, the planner keeps that model instead and files the Containers'
# first issues, as the webshop does. Needs church-ops in the chart's
# gitea.projects (the catalog, the Agents and GitProvider gitea) and Secret
# claude-credentials.
apiVersion: theos.factory.io/v1beta1
kind: Brief
metadata:
  name: church-ops
  namespace: church-ops
spec:
  idea: >-
    Church Ops is what our church's worship team plans, schedules and
    rehearses with, in the Netherlands. Each kind of service (Sunday
    morning, youth night) has a template: its usual order of items and the
    positions it needs (worship leader, vocals, keys, drums, guitar, bass,
    front of house, stream). The worship leader starts next Sunday's plan
    from that template, sets the songs, and for each song the arrangement,
    the key it is played in that week and who leads it; items have lengths,
    so the plan shows when each one starts and when the service ends, and
    notes per team (vocals, band, tech). The plan has its times: the
    rehearsal and the service. Our song library keeps each song's
    arrangements with their sequence (V1 C V2 C B C), tempo, meter, length,
    the keys we play it in, a link to a recording, and the lyrics and chords
    as a chord chart that follows any key. Team leaders schedule their team
    from the plan: they see which positions are still open, and for each one
    who can play it, with anyone who blocked out that date, already serves
    elsewhere that day or declined flagged, but never refused. Volunteers get
    the request in our team chat, answer in one tap on their phone, can
    decline with a reason or withdraw later, keep their own blockout dates,
    and see their schedule. Before rehearsal every musician opens the plan
    and sees each song in the key we play it, with the chart, the sequence,
    the tempo and their team's notes. A grid of the coming months shows who
    serves where. On Sunday one person advances the run sheet and everyone
    follows with a timer per item; the stream's scene in OBS and the next
    song in Ableton Live can follow it. We report song usage to CCLI. It
    runs on the Kubernetes cluster it is built on.
