# One Project per namespace, named after it. The chart's seed makes Project
# church-ops when church-ops is in gitea.projects and the namespace has none;
# applying this one sets its story text. No license: the factory never picks
# one, and with none set each Container is scaffolded without a LICENSE.
apiVersion: theos.factory.io/v1beta1
kind: Project
metadata:
  name: church-ops
  namespace: church-ops
spec:
  displayName: Church Ops
  description: >-
    What a church's worship team plans, schedules and rehearses with: plans
    from service-type templates, a song library with charts in every key,
    scheduling teams position by position, and the run sheet on Sunday.
---
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: worship-leader
  namespace: church-ops
spec:
  displayName: Worship leader
  description: Plans each service's songs, arrangements and keys, and leads the band and its rehearsals.
---
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: team-leader
  namespace: church-ops
spec:
  displayName: Team leader
  description: Leads a team (band, vocals, tech) and schedules its positions for each plan, following up declines.
---
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: volunteer
  namespace: church-ops
spec:
  displayName: Volunteer
  description: Serves in a team as a musician, vocalist or technician; answers requests, keeps their blockouts and rehearses the songs of the plans they serve in.
---
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: pastor
  namespace: church-ops
spec:
  displayName: Pastor
  description: Owns the service order, adds the sermon and readings, and keeps the pastoral notes no one else sees.
---
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: tech-operator
  namespace: church-ops
spec:
  displayName: Tech and stream operator
  description: Runs live mode in the booth on a Sunday, advancing the run sheet that switches the stream's scenes and starts the band's tracks.
---
apiVersion: theos.factory.io/v1beta1
kind: Person
metadata:
  name: member
  namespace: church-ops
spec:
  displayName: Member
  description: Belongs to the church; sees the coming services and their order, and watches the stream.
