# The system the factory builds, and the three it only names. church-ops is
# Internal (the default location) and is about the church-ops Domain. OBS,
# Ableton Live and the chat host are External: they hold no Containers or
# DataStores, and the links to them are story only.
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: church-ops
  namespace: church-ops
spec:
  displayName: Church Ops
  description: What the worship team plans, schedules and rehearses with, from the service type's template to the run sheet on Sunday.
  location: Internal
  domainRefs: [church-ops]
  needs:
  - A worship leader builds next Sunday's plan from the service type's template in minutes, with each song's arrangement, key and song leader
  - Every musician sees each song of the plan in the key it is played in, with its chart, sequence and their team's notes, before rehearsal
  - A team leader sees which positions are still open and who can fill them; blockouts, conflicts and declines are flagged but never block
  - A volunteer answers a request in one tap, can decline with a reason, and is reminded a week and a day before
  - On Sunday one person advances the run sheet with item timers, and the stream's scene and the band's next song can follow it
  - Song usage is ready for the church's CCLI report
  - Pastoral notes and minors' details are seen only by the people who must see them
  kpis:
  - Positions filled a week before each service
  - Requests answered within two days
  - Plans with every song's arrangement and key set by the Wednesday before
---
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: obs
  namespace: church-ops
spec:
  displayName: OBS Studio
  description: Streams and records the service from the booth computer; switches scenes and shows lower thirds when told to over obs-websocket v5.
  location: External
---
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: ableton
  namespace: church-ops
spec:
  displayName: Ableton Live
  description: Plays the click, cues and backing tracks into the band's ears from the stage computer; takes song, tempo and transport commands over OSC.
  location: External
---
apiVersion: theos.factory.io/v1beta1
kind: SoftwareSystem
metadata:
  name: chat-host
  namespace: church-ops
spec:
  displayName: Chat host
  description: Where the teams chat and get their requests and reminders, a Matrix homeserver (Slack or WhatsApp through other adapters).
  location: External
